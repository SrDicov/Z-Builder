name: Build Z-Linux ISO

on:
  push:
    branches: [main, wip]
    paths: ["iso-profiles/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["iso-profiles/**"]
  workflow_dispatch:
    inputs:
      profile: {description: "profile", default: "zlinux", type: string}
      initsys: {description: "initsys", default: "dinit", type: string}

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:base-dinit
      options: --privileged
    steps:
      - name: Checkout Z-Builder
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Cache pacman pkg
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('iso-profiles/zlinux/profile.yaml', 'iso-profiles/common/**', 'iso-profiles/artools-patches/**') }}
          restore-keys: pacman-

      - name: Setup builder (pacman CachyOS + artools + limine)
        run: |
          set -x
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed base-devel git squashfs-tools xorriso dosfstools mtools edk2-ovmf qemu-base limine
          # Configura repos CachyOS para el host y para artools (soporta x86_64_v3)
          mkdir -p /etc/pacman.d
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.d/cachyos-mirrorlist /etc/pacman.d/ || true
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.d/cachyos-v3-mirrorlist /etc/pacman.d/ || true
          mkdir -p ~/.config/artools/pacman.conf.d
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.conf ~/.config/artools/pacman.conf.d/iso-x86_64.conf
          # Artools (chroot) no debe tener IgnorePkg para el basestrap inicial, solo para el sistema ya instalado
          sed -i '/^IgnorePkg/d' ~/.config/artools/pacman.conf.d/iso-x86_64.conf
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.conf /etc/pacman.conf
          # Instala pacman CachyOS (soporta x86_64_v3, stock rechaza v3)
          cp /etc/pacman.conf /tmp/pacman.conf.bak
          cp ~/.config/artools/pacman.conf.d/iso-x86_64.conf /tmp/artools-pacman.conf.bak
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf
          sed -i 's/^SigLevel.*/SigLevel = Never/' ~/.config/artools/pacman.conf.d/iso-x86_64.conf
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed cachyos-keyring cachyos-mirrorlist cachyos-v3-mirrorlist || true
          # Reemplaza pacman stock por el de CachyOS (soporta x86_64_v3); restaura conf Z-Linux que sobreescribe
          pacman -S --noconfirm cachyos/pacman || true
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.conf /etc/pacman.conf
          cp -v iso-profiles/zlinux/root-overlay/etc/pacman.conf ~/.config/artools/pacman.conf.d/iso-x86_64.conf
          sed -i '/^IgnorePkg/d' ~/.config/artools/pacman.conf.d/iso-x86_64.conf
          pacman-key --init || true
          pacman-key --populate cachyos || true
          pacman-key --populate artix archlinux || true
          pacman -Sy --noconfirm
          # artools-iso
          pacman -Sy --noconfirm artools-iso || (git clone https://gitea.artixlinux.org/artix/artools.git /tmp/artools && make -C /tmp/artools install)
          # Parches Z-Linux
          bash ./iso-profiles/artools-patches/aplicar-parches.sh
          bash -n /usr/share/artools/lib/iso/*.sh /usr/bin/buildiso
          ls -lh /usr/share/artools/lib/iso/config.sh
          echo "=== artools pacman.conf (sin IgnorePkg para basestrap) ==="
          grep -E '^\[|IgnorePkg' ~/.config/artools/pacman.conf.d/iso-x86_64.conf | head -n 30 || true
          echo "=== verifica pines Artix resuelven en config artools ==="
          for p in system/dbus system/util-linux system/util-linux-libs system/pam system/procps-ng system/gnupg system/gpgme system/libassuan world/libmm-glib world/libwireplumber world/modemmanager world/pcsclite world/wireplumber world/udisks2 world/fluidsynth world/sdbus-cpp world/seatd world/polkit world/libpulse world/gnome-keyring world/rtkit dinit dinit-rc elogind; do
            pacman --config ~/.config/artools/pacman.conf.d/iso-x86_64.conf -Si "$p" 2>&1 | grep -E '^(Nombre|Name|Repositorio|Repository|Versi|Version)' | head -n 2 || echo "PIN FALLO: $p"
          done

      - name: Build ISO (chroot + squash + limine)
        run: |
          set -eo pipefail
          set -x
          # /var/lib/artools vive en overlay del contenedor y el kernel
          # rechaza overlay-sobre-overlay como upperdir (make_livefs).
          # Redirige el workdir al workspace (bind mount ext4 del host).
          mkdir -p "${GITHUB_WORKSPACE}/buildiso-work"
          mkdir -p /var/lib/artools
          rm -rf /var/lib/artools/buildiso
          ln -s "${GITHUB_WORKSPACE}/buildiso-work" /var/lib/artools/buildiso
          df -h "${GITHUB_WORKSPACE}" /var/lib/artools/buildiso | head
          stat -f -c 'fstype=%T' "${GITHUB_WORKSPACE}/buildiso-work" /tmp
          # Evita que los mounts del chroot se propaguen y dejen busy el umount
          mount --make-rprivate / 2>/dev/null || true
          mount --make-rprivate "${GITHUB_WORKSPACE}/buildiso-work" 2>/dev/null || true
          mkdir -p ~/artools-workspace
          cp -a iso-profiles ~/artools-workspace/
          # -x = solo chroot, verifica antes del squash
          buildiso -p "${{ inputs.profile || 'zlinux' }}" -i "${{ inputs.initsys || 'dinit' }}" -x 2>&1 | tee /tmp/build-x.log | tail -n 100
          ~/artools-workspace/iso-profiles/artools-patches/verificar-chroot.sh /var/lib/artools/buildiso/zlinux/dinit/livefs | tee /tmp/verificar.log
          # Build completo (squash + iso limine)
          buildiso -p "${{ inputs.profile || 'zlinux' }}" -i "${{ inputs.initsys || 'dinit' }}" 2>&1 | tee /tmp/build.log | tail -n 100
          ls -lh ~/artools-workspace/iso/zlinux/
          sha256sum ~/artools-workspace/iso/zlinux/*.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build logs (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build-x.log
            /tmp/verificar.log
            /tmp/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlinux-iso
          path: |
            ~/artools-workspace/iso/zlinux/*.iso
            SHA256SUMS
            iso-profiles/zlinux/profile.yaml
          retention-days: 14
          if-no-files-found: error
