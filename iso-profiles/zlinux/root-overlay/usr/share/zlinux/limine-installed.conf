# Z-Linux — plantilla limine.conf para el SISTEMA INSTALADO.
# (El menu del LIVE lo genera artools prepare_limine(); este fichero es la
# referencia para instalacion manual y para Kasha. Sustituir <UUID-ROOT>.)
# Ubicacion instalada: /boot/limine.conf  (+ copia EFI si se usa Embebido)
# Limine 12.x — ver keys en /usr/share/doc/limine/CONFIG.md
timeout: 10
default_entry: 1
remember_last_entry: yes

interface_branding: Z-Linux
interface_branding_colour: abc2ab
interface_help_colour: 478061

wallpaper: boot():/splash-1080.png
wallpaper_style: centered
backdrop: 000000

graphics: yes
mouse: yes
editor_enabled: yes
quiet: no

/Z-Linux
    comment: Arranque normal
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos-bore
    module_path: boot():/intel-ucode.img
    module_path: boot():/amd-ucode.img
    module_path: boot():/initramfs-linux-cachyos-bore.img
    cmdline: root=UUID=<UUID-ROOT> rootflags=subvol=@ rw zswap.enabled=0 quiet

/Opciones avanzadas
    //Z-Linux (modo compatibilidad)
        comment: Sin aceleracion grafica (nomodeset)
        protocol: linux
        kernel_path: boot():/vmlinuz-linux-cachyos-bore
        module_path: boot():/intel-ucode.img
        module_path: boot():/amd-ucode.img
        module_path: boot():/initramfs-linux-cachyos-bore.img
        cmdline: root=UUID=<UUID-ROOT> rootflags=subvol=@ rw zswap.enabled=0 nomodeset
    //Consola de rescate
        comment: Shell como root (init=/bin/bash)
        protocol: linux
        kernel_path: boot():/vmlinuz-linux-cachyos-bore
        module_path: boot():/intel-ucode.img
        module_path: boot():/amd-ucode.img
        module_path: boot():/initramfs-linux-cachyos-bore.img
        cmdline: root=UUID=<UUID-ROOT> rootflags=subvol=@ rw zswap.enabled=0 init=/bin/bash

/Memtest86+
    comment: Test de memoria RAM
    protocol: linux
    kernel_path: boot():/memtest
