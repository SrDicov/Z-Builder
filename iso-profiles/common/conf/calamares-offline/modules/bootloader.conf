---
# Z-Linux: el instalador (Kasha) pondra Limine aqui. Mientras tanto este
# fichero refleja el kernel real de la distro (NO el generico de Artix).
efiBootLoader: "grub"

kernel: "/vmlinuz-linux-cachyos-bore"
img: "/initramfs-linux-cachyos-bore.img"
fallback: "/initramfs-linux-cachyos-bore-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
