---

live-session:
  user: artix
  password: artix
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    - chrony
    - cupsd
    - metalog
    - NetworkManager
    - sddm
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber
rootfs:
  packages:
    - artix-sddm-theme
    - ark
    - bluedevil
    - breeze
    - breeze-gtk
    - kactivitymanagerd
    - kde-cli-tools
    - kdecoration
    - kde-gtk-config
    - kdeplasma-addons
    - kgamma
    - kglobalacceld
    - kinfocenter
    - kmenuedit
    - kpipewire
    - kscreen
    - kscreenlocker
    - ksshaskpass
    - ksystemstats
    - kwallet-pam
    - kwayland
    - kwayland-integration
    - kwin
    - kwrited
    - layer-shell-qt
    - libkscreen
    - libksysguard
    - libplasma
    - milou
    - ocean-sound-theme
    - oxygen
    - oxygen-sounds
    - plasma5support
    - plasma-activities
    - plasma-activities-stats
    - plasma-browser-integration
    - plasma-desktop
    - plasma-disks
    - plasma-integration
    - plasma-nm
    - plasma-pa
    - plasma-systemmonitor
    - plasma-welcome
    - plasma-workspace
    - polkit-kde-agent
    - powerdevil
    - print-manager
    - qqc2-breeze-style
    - sddm-kcm
    - systemsettings
    - wacomtablet
    - qt6-multimedia-ffmpeg
    - ark
    - dolphin
    - falkon
    - ffmpegthumbs
    - gwenview
    - kate
    - keditbookmarks
    - kfind
    - kgpg
    - kio-admin
    - konsole
    - kwalletmanager
    - okular
    - artix-icons
    - artix-wallpapers
    - artix-plasma-splash
    - hiredis
    - libdbi
    - libesmtp
    - libmaxminddb
    - librabbitmq-c
    - librdkafka
    - mongo-c-driver
    - net-snmp
    - pipewire-pulse
  packages-init:
    dinit:
      - cups-dinit
      - metalog-dinit
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - userspawn-dinit
      - networkmanager-dinit
      - sddm-dinit
    openrc:
      - cups-openrc
      - metalog-openrc
      - pipewire-openrc
      - pipewire-pulse-openrc
      - wireplumber-openrc
      - networkmanager-openrc
      - sddm-openrc
    runit:
      - cups-runit
      - metalog-runit
      - userspawn-runit
      - networkmanager-runit
      - sddm-runit
    s6:
      - cups-s6
      - metalog-s6
      - networkmanager-s6
      - sddm-s6
livefs:
  packages:
    - artix-docs
    - artix-grub-live
    - broadcom-wl
    - calamares-extensions
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - virtualbox-guest-utils
    - konversation
    - partitionmanager
  packages-init:
    dinit:
      - artix-live-dinit
    openrc:
      - artix-live-openrc
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
