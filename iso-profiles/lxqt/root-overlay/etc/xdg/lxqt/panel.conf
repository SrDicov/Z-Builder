[General]
__userfile__=true

[mainmenu]
alignment=Left
icon=/usr/share/icons/artix/logo.svg
ownIcon=true
type=mainmenu

[mount2]
alignment=Right
type=mount

[panel1]
plugins=mainmenu, showdesktop2, quicklaunch2, taskbar2, mount2, statusnotifier, volume2, worldclock2, tray2
background-color=@Variant(\0\0\0\x43\x1\xff\xff******\0\0)
iconSize=36
opacity=75
panelSize=38

[quicklaunch2]
alignment=Left
apps\1\desktop=/usr/share/applications/org.kde.falkon.desktop
apps\2\desktop=/usr/share/applications/org.kde.konversation.desktop
apps\3\desktop=/usr/share/applications/qterminal.desktop
apps\size=3
type=quicklaunch

[showdesktop2]
alignment=Left
type=showdesktop

[statusnotifier]
alignment=Left
type=statusnotifier

[taskbar2]
alignment=Left
type=taskbar

[tray2]
alignment=Right
type=tray

[volume2]
alignment=Right
type=volume

[worldclock2]
alignment=Right
type=worldclock
