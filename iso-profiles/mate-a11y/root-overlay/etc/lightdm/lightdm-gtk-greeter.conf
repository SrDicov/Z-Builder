# Enable accessibility
[greeter]
clock-format = %a %d %B %Y, %H:%M:%S
position = 80%,center
font-name = Roboto 14
theme-name = Artix-dark
icon-theme-name = Adwaita
cursor-theme-name = Premium
xft-antialias = true
xft-dpi = 115
xft-rgba = rgb
xft-hintstyle = hintfull
background = /usr/share/backgrounds/Artix_dna_spiral_dark_bw.jpg
default-user-image = /usr/share/icons/artix/logo.svg
round-user-image = false
indicators = ~host;~spacer;~clock;~spacer;~a11y;~session;~language;~power
reader = orca
a11y-states = +reader
